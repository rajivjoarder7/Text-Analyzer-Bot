
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Text Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Text Analysis</h1>
        <form method="POST">
            <textarea id="context" name="context" rows="10" placeholder="Type or paste your paragraph here..." oninput="updateCounters()"></textarea>
            <div class="counter">
                <span>Words: <span id="wordCount">0</span></span>
                <span>Characters: <span id="charCount">0</span></span>
            </div>
            
            <button type="submit" name="summarize" id="summarizeBtn" style="display:none;">Summarize</button>
            <button type="button" id="askBtn" style="display:none;" onclick="toggleQA()">Ask Questions</button>
            
            <div id="qaSection" style="display:none;">
                <input type="text" name="question" placeholder="Enter your question here...">
                <button type="submit" name="ask_question">Ask</button>
            </div>

            {% if answer %}
                <div class="answer">
                    <p>Answer: {{ answer }}</p>
                </div>
            {% endif %}
        </form>
        <button onclick="resetForm()">RESET</button>
    </div>

    <script>
        function updateCounters() {
            const context = document.getElementById("context").value;
            document.getElementById("charCount").textContent = context.length;
            document.getElementById("wordCount").textContent = context.trim().split(/\s+/).length;
            
            if (context.length >= 200) {
                document.getElementById("askBtn").style.display = "inline";
            }
            if (context.length >= 2000) {
                document.getElementById("summarizeBtn").style.display = "inline";
            }
        }

        function toggleQA() {
            const qaSection = document.getElementById("qaSection");
            qaSection.style.display = qaSection.style.display === "none" ? "block" : "none";
        }

        function resetForm() {
            document.getElementById("context").value = "";
            document.getElementById("wordCount").textContent = 0;
            document.getElementById("charCount").textContent = 0;
            document.getElementById("summarizeBtn").style.display = "none";
            document.getElementById("askBtn").style.display = "none";
            document.getElementById("qaSection").style.display = "none";
        }
    </script>
</body>
</html>
